[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "copulaendog"
version = "0.1.0"
description = "Instrument-free Gaussian copula corrections for endogenous regressors"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "patsy>=0.5",
]

[project.urls]
"Reference implementation (R)" = "https://github.com/HashtagHaschka/Copula-based-endogeneity-corrections"
"endogCopula (R package)" = "https://github.com/ashgreat/endogCopula"

[tool.setuptools]
packages = ["copulaendog"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning"]
